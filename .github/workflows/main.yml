name: ACEest CI CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check syntax and lint
        run: |
          # checking critical syntax errors
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit zero so warnings dont block build
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Pytest on runner
        run: |
          pytest tests/ -v

  docker-build-test:
    needs: build-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t aceest-fitness-app:${{ github.sha }} .

      - name: Run tests inside the docker container
        run: |
          docker run --rm aceest-fitness-app:${{ github.sha }} pytest tests/ -v
